<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Dr. Somnath Clinic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #22c55e, #166534);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .logo-text { font-size: 17px; font-weight: 700; color: #0b3d1f; }
    h1 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 12px; }
    p  { font-size: 15px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 13px 32px;
      background: #166534;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
    }
    .btn:hover { background: #15803d; }
    .status {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
    .pulse {
      display: inline-block;
      width: 8px; height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text">Dr. Somnath Clinic</div>
    </div>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Some features need a connection to work, but we'll be back
      as soon as you're online again.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Try Again
    </button>
    <div class="status">
      <span class="pulse"></span>
      Waiting for connection…
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
