<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Queue Display — Real Time</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #050f0a;
      color: #e8fef0;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
    }

    .left {
      flex: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .right {
      flex: 1;
      border-left: 1px solid #1a3d24;
      padding: 20px;
    }

    .big {
      font-size: 120px;
      color: #00c853;
    }

    .next-item {
      padding: 10px;
      border-bottom: 1px solid #1a3d24;
    }

    .live {
      position: fixed;
      top: 10px;
      right: 20px;
      color: #00c853;
    }

    .offline {
      color: red;
    }
  </style>
</head>
<body>

<div class="live" id="status">● LIVE</div>

<div class="left">
  <h2>Now Serving</h2>
  <div id="token" class="big">---</div>
</div>

<div class="right">
  <h3>Up Next</h3>
  <div id="nextList"></div>
</div>

<script>
  const socket = io("https://clinic-backend-mxto.onrender.com");

  const tokenEl = document.getElementById("token");
  const nextEl  = document.getElementById("nextList");
  const status  = document.getElementById("status");

  let currentToken = null;

  // ✅ Listen for real-time updates
  socket.on("queue:update", (data) => {
    updateUI(data);
    setOnline(true);
  });

  socket.on("connect_error", () => {
    setOnline(false);
  });

  function updateUI(data) {
    const current = data.appointment?.current;
    const next    = data.appointment?.next || [];

    // 🎯 Update only if changed
    if (current?.tokenStr !== currentToken) {
      currentToken = current?.tokenStr || "---";
      tokenEl.textContent = currentToken;
      flash();
      beep();
    }

    // 🎯 Efficient list update
    nextEl.innerHTML = "";
    next.slice(0, 5).forEach((item) => {
      const div = document.createElement("div");
      div.className = "next-item";
      div.textContent = item.tokenStr;
      nextEl.appendChild(div);
    });
  }

  function setOnline(state) {
    status.textContent = state ? "● LIVE" : "● OFFLINE";
    status.className   = state ? "live" : "live offline";
  }

  function flash() {
    document.body.style.background = "#072015";
    setTimeout(() => {
      document.body.style.background = "#050f0a";
    }, 200);
  }

  function beep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  }
</script>

</body>
</html>
